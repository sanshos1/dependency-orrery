<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dependency Orrery</title>
    <style>
      :root {
        --ink: #eef0d7;
        --void: #090b13;
        --blue: #6ee7f2;
        --brass: #e6b964;
        --red: #ff6a61;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        background-color: #090b13;
      }
      body {
        margin: 0;
        background-image: radial-gradient(
          circle at 40% 45%,
          #17213a 0%,
          #0b1020 38%,
          #090b13 72%
        );
        color: var(--ink);
        font:
          15px/1.45 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        overflow: hidden;
      }
      button,
      input {
        font: inherit;
      }
      .mast {
        position: fixed;
        z-index: 5;
        left: 28px;
        top: 24px;
      }
      .mast h1 {
        font: 500 17px/1;
        margin: 0;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .mast p {
        color: #8991a5;
        font-size: 11px;
        letter-spacing: 0.12em;
      }
      .connect {
        position: fixed;
        right: 28px;
        top: 22px;
        z-index: 8;
        background: transparent;
        color: var(--ink);
        border: 1px solid #596078;
        padding: 10px 14px;
        border-radius: 50% 50% 44% 56%;
        transition: opacity 0.2s ease;
      }
      body:has(.drawer.open) .connect {
        opacity: 0;
        pointer-events: none;
      }
      .stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .orrery {
        position: relative;
        width: min(74vw, 760px);
        aspect-ratio: 1;
        border: 1px solid #38415e;
        border-radius: 50%;
        background: #0d1323cc;
        box-shadow: 0 0 90px #15234f88 inset;
      }
      .orrery:before,
      .orrery:after {
        content: "";
        position: absolute;
        border: 1px dashed #303958;
        border-radius: 50%;
        inset: 14%;
      }
      .orrery:after {
        inset: 30%;
      }
      .nucleus {
        position: absolute;
        inset: 40%;
        border-radius: 50%;
        border: 1px solid var(--brass);
        background: #11162a;
        color: var(--brass);
        display: grid;
        place-items: center;
        text-align: center;
        cursor: pointer;
        box-shadow: 0 0 55px #e6b96435;
      }
      .body {
        position: absolute;
        width: 92px;
        height: 92px;
        border-radius: 50%;
        border: 1px solid #4f5878;
        background: #0f1526;
        color: var(--ink);
        display: grid;
        place-items: center;
        text-align: center;
        font-size: 10px;
        letter-spacing: 0.1em;
        cursor: pointer;
      }
      .b1 {
        left: -46px;
        top: 44%;
      }
      .b2 {
        right: 5%;
        top: 6%;
      }
      .b3 {
        right: -46px;
        bottom: 22%;
      }
      .path {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .path:before {
        content: "";
        position: absolute;
        width: 42%;
        height: 1px;
        background: linear-gradient(
          90deg,
          var(--red),
          var(--brass),
          var(--blue)
        );
        left: 29%;
        top: 50%;
        transform: rotate(-24deg);
        opacity: 0;
        transition: 0.7s;
      }
      .orrery.final .path:before {
        opacity: 1;
        box-shadow: 0 0 16px var(--blue);
      }
      .legend {
        position: fixed;
        left: 28px;
        bottom: 26px;
        color: #68708a;
        font-size: 11px;
      }
      .status {
        color: var(--blue);
      }
      .drawer {
        position: fixed;
        z-index: 7;
        right: 0;
        top: 0;
        height: 100%;
        width: min(430px, 94vw);
        background: #101525ee;
        border-left: 1px solid #515978;
        padding: 72px 34px 30px;
        transform: translateX(101%);
        transition: 0.35s;
        overflow: auto;
      }
      .drawer.open {
        transform: none;
      }
      .drawer h2 {
        font:
          400 28px/1.1 Georgia,
          serif;
        color: var(--brass);
      }
      label {
        display: block;
        margin: 18px 0 5px;
        color: #8d95aa;
        font-size: 10px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      input {
        width: 100%;
        border: 0;
        border-bottom: 1px solid #4a526b;
        background: transparent;
        color: var(--ink);
        padding: 10px 2px;
        outline: none;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 25px;
      }
      .actions button {
        border: 1px solid var(--brass);
        background: transparent;
        color: var(--brass);
        padding: 11px 14px;
        cursor: pointer;
      }
      .actions .hot {
        background: var(--brass);
        color: #15120b;
      }
      .close {
        position: absolute;
        right: 22px;
        top: 20px;
        background: none;
        border: 0;
        color: #8991a5;
        font-size: 24px;
      }
      .readout {
        white-space: pre-wrap;
        color: #b8bed0;
        margin-top: 22px;
        font-size: 12px;
      }
      .toast {
        position: fixed;
        z-index: 20;
        left: 50%;
        bottom: 25px;
        transform: translate(-50%, 20px);
        opacity: 0;
        background: #eef0d7;
        color: #111529;
        padding: 10px 16px;
        transition: 0.25s;
      }
      .toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (max-width: 720px) {
        .orrery {
          width: 92vw;
        }
        .body {
          width: 68px;
          height: 68px;
        }
        .mast {
          left: 18px;
        }
        .legend {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="mast">
      <h1>Dependency Orrery</h1>
      <p>trace what can actually reach the core</p>
    </header>
    <button class="connect" id="connect">link wallet</button>
    <main class="stage">
      <section class="orrery" id="orrery">
        <div class="path"></div>
        <button class="body b1" data-open>MANIFEST<br />installed</button
        ><button class="body b2" data-open>TRACE<br />observed</button
        ><button class="body b3" data-open>ADVISORY<br />published</button
        ><button class="nucleus" id="nucleus">
          <span id="finding">OPEN<br />THE INDEX</span>
        </button>
      </section>
    </main>
    <div class="legend">
      TELESCOPE <span class="status" id="status">READY / NO SCAN</span>
    </div>
    <aside class="drawer" id="drawer">
      <button class="close" id="close">×</button>
      <h2>Set the three bodies in orbit.</h2>
      <label>Scan ID</label><input id="id" value="GLYPH-TRACE-01" /><label
        >Subject</label
      ><input
        id="subject"
        value="Orbit renderer production reachability"
      /><label>Dependency manifest</label
      ><input
        id="manifest"
        value="https://raw.githubusercontent.com/sanshos1/dependency-orrery/main/fixtures/manifest.txt"
      /><label>Runtime trace</label
      ><input
        id="trace"
        value="https://raw.githubusercontent.com/sanshos1/dependency-orrery/main/fixtures/runtime-trace.txt"
      /><label>Public advisory</label
      ><input
        id="advisory"
        value="https://raw.githubusercontent.com/sanshos1/dependency-orrery/main/fixtures/advisory.txt"
      />
      <div class="actions">
        <button class="hot" id="openScan">open scan</button
        ><button id="resolve">resolve</button><button id="read">read</button>
      </div>
      <div class="readout" id="readout">No frozen record loaded.</div>
    </aside>
    <div class="toast" id="toast"></div>
    <script type="module">
      import { createClient } from "https://esm.sh/genlayer-js@1.1.8";
      import { studionet } from "https://esm.sh/genlayer-js@1.1.8/chains";
      const ADDRESS = "0xF526Db186B92aEAcE4Aa3082d3b45f58c864f121",
        ENDPOINT = "https://studio.genlayer.com/api",
        $ = (s) => document.querySelector(s);
      let client;
      const toast = (x, sticky = false) => {
          let e = $("#toast");
          e.textContent = x?.message || x;
          e.classList.add("on");
          if (!sticky) setTimeout(() => e.classList.remove("on"), 4200);
        },
        status = (x) => ($("#status").textContent = x);
      async function connect() {
        if (!window.ethereum) throw Error("Install MetaMask or Rabby.");
        const [a] = await ethereum.request({ method: "eth_requestAccounts" });
        client = createClient({
          chain: studionet,
          endpoint: ENDPOINT,
          account: a,
          provider: ethereum,
        });
        $("#connect").textContent = a.slice(0, 5) + "…" + a.slice(-3);
        return client;
      }
      async function send(fn, args) {
        const c = client || (await connect());
        status("SUBMITTED / " + fn.toUpperCase());
        const hash = await c.writeContract({
          address: ADDRESS,
          functionName: fn,
          args,
          value: 0n,
        });
        status("ACCEPTED / WAITING FOR FINALIZED");
        const r = await c.waitForTransactionReceipt({
          hash,
          status: "FINALIZED",
          retries: 180,
          interval: 5000,
        });
        if (
          String(r.result_name ?? r.resultName ?? "").toUpperCase() !==
          "MAJORITY_AGREE"
        )
          throw Error("FINALIZED WITHOUT AGREEMENT");
        status("FINALIZED / " + fn.toUpperCase());
        return hash;
      }
      async function read() {
        const c =
          client || createClient({ chain: studionet, endpoint: ENDPOINT });
        const x = await c.readContract({
          address: ADDRESS,
          functionName: "get_scan",
          args: [$("#id").value.trim()],
        });
        $("#readout").textContent = JSON.stringify(
          x,
          (_, v) => (typeof v === "bigint" ? v.toString() : v),
          2,
        );
        $("#finding").innerHTML =
          (x.finding || x.state) + "<br>" + (x.package || "");
        $("#orrery").classList.toggle("final", x.state === "FINALIZED");
        status(x.state + " / " + (x.reason_code || "SOURCES FROZEN"));
        return x;
      }
      document
        .querySelectorAll("[data-open]")
        .forEach((x) => (x.onclick = () => $("#drawer").classList.add("open")));
      $("#nucleus").onclick = () => $("#drawer").classList.add("open");
      $("#close").onclick = () => $("#drawer").classList.remove("open");
      $("#connect").onclick = () => connect().catch((e) => toast(e, true));
      $("#openScan").onclick = async () => {
        try {
          await send("open_scan", [
            $("#id").value,
            $("#subject").value,
            $("#manifest").value,
            $("#trace").value,
            $("#advisory").value,
          ]);
          await read();
        } catch (e) {
          toast(e, true);
        }
      };
      $("#resolve").onclick = async () => {
        try {
          await send("resolve_scan", [$("#id").value]);
          await read();
        } catch (e) {
          toast(e, true);
        }
      };
      $("#read").onclick = () => read().catch((e) => toast(e, true));
    </script>
  </body>
</html>
